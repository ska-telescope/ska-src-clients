version: '3.8'

services:
  backend:
    build:
      context: .
      dockerfile: src/ska-src-web-ui/backend/Dockerfile
    ports:
      - "8422:8000"
    volumes:
      - ./src/ska-src-web-ui/backend:/app
      - ./etc/cfg:/etc/cfg:rw
      - /tmp/srcnet:/tmp/srcnet  # Mount token storage
    environment:
      - PYTHONPATH=/app
      - SRCNET_CONFIG_PATH=/etc/cfg/oper.yml
    working_dir: /app
    command: python main.py
    depends_on:
      - frontend
    networks:
      - ska-web-ui

  frontend:
    build:
      context: .
      dockerfile: src/ska-src-web-ui/frontend/Dockerfile
    ports:
      - "3000:3000"
    volumes:
      - ./src/ska-src-web-ui/frontend:/app
      - /app/node_modules
    environment:
      - VITE_API_URL=http://localhost:8422/api/v1
    working_dir: /app
    command: npm start
    networks:
      - ska-web-ui

networks:
  ska-web-ui:
    driver: bridge 