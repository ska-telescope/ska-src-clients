[tool.poetry]
name = "ska-src-clients"
version = "0.1.27"
description = "SKA SRC Client"
authors = ["Rob Barnsley", "Shraddha Bajare"]
license = "BSD-3-Clause"
packages = [
    { include = "ska_src_clients", from = "src" }
]
include = [
    { path = 'etc/cfg/oper.yml' },
    { path = 'etc/cfg/user.yml' }
]

[[tool.poetry.source]]
name = 'ska-nexus'
url = 'https://artefact.skao.int/repository/pypi-internal/simple'

[[tool.poetry.source]]
name = "PyPI-public"
url = 'https://pypi.org/simple'

[[tool.poetry.source]]
name = "webdavclient3"
url = "https://github.com/ezhov-evgeny/webdav-client-python-3@98c23d1"

[[tool.poetry.source]]
name = "permissions_api"
url = "https://gitlab.com/api/v4/projects/48060714/packages/pypi/simple"

[[tool.poetry.source]]
name = "authn_api"
url = "https://gitlab.com/api/v4/projects/48376510/packages/pypi/simple"

[tool.poetry.dependencies]
python = ">=3.8.1,<4.0.0"
docker = "5.0.3"
Django = "4.2"
qrcode = "7.4.2"
plotly = "5.3.1"
prettytable = "3.3.0"
PyJWT = "2.8.0"
python-box = "5.4.1"
click = "8.1.8"
click-didyoumean = "0.3.1"
click-plugins = "1.1.1"
click-repl = "0.3.0"
trogon = "0.6.0"
webdavclient3 = "*"
ska-src-authn-api = {version = "^0.4", allow-prereleases = false}
ska-src-data-management-api = {version = "^0.6", allow-prereleases = false}
ska-src-permissions-api = {version = "^0.1", allow-prereleases = false}
ska-src-site-capabilities-api = {version = "^0.3", allow-prereleases = false}

[tool.poetry.dev-dependencies]
black = "^23.3.0"
isort = "^5.10.1"
flake8 = "^5.0.4"
pylint = "3.1.0"
pylint-junit = "^0.3.2"
coverage = "^6.2"
pytest-cov = "^4.0.0"
pytest-json-report = "^1.4.1"
pytest-forked = "^1.3.0"
pytest-mock = "^3.10.0"
pytest-xdist = "^2.4.0"
pytest-repeat = "^0.9.1"

[tool.poetry.group.docs.dependencies]
Sphinx = "^5.2"
docutils = "^0.17"
ska-ser-sphinx-theme = "^0.1.1"
sphinx-autodoc-typehints = "^1.19"

[tool.poetry.scripts]
srcnet-oper = "ska_src_clients.cli.oper:cli"
srcnet-user = "ska_src_clients.cli.user:cli"

[tool.isort]
multi_line_output = 3
include_trailing_comma = true
force_grid_wrap = 0

[tool.black]
line-length = 99

[build-system]
requires = ["poetry-core>=1.0.0"]
build-backend = "poetry.core.masonry.api"