<!DOCTYPE html>
<html>
<head>
    <title>SRCNet Operator Interface</title>
    <style>
        body {
            font-family: sans-serif;
            margin: 2em;
            background-color: #f9f9f9;
        }
        h1 {
            text-align: center;
            margin-bottom: 2em;
        }
        .menu-container {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 1em;
            max-width: 800px;
            margin: 0 auto;
        }
        .menu-card {
            background: white;
            padding: 1em;
            border-radius: 8px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
            text-align: center;
            transition: transform 0.2s, box-shadow 0.2s;
        }
        .menu-card:hover {
            transform: translateY(-4px);
            box-shadow: 0 4px 10px rgba(0,0,0,0.15);
        }
        .menu-card a {
            display: block;
            text-decoration: none;
            color: #333;
            font-size: 1.1em;
            margin-top: 0.5em;
        }
    </style>
</head>
<body>
    <h1>SRCNet Operator Interface</h1>

    <div class="menu-container">
        <div class="menu-card">
            <strong>Status</strong>
            <a href="{% url 'oper:api_status' %}">APIs</a>
        </div>
        <div class="menu-card">
            <strong>Something else</strong>
        </div>
        <div class="menu-card">
            <strong>Something else</strong>
        </div>
        <div class="menu-card">
            <strong>Something else</strong>
        </div>
    </div>
</body>
</html>
